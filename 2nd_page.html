<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainy: AI IELTS Prep — Welcome</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* Reset and Full-Viewport Setup */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #F4F5F0;
      color: #182542;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Display Heading Font Matching Reference */
    .display-title {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      letter-spacing: -0.03em;
      line-height: 1.08;
    }

    /* Subtle Entrance & Ambient Motion */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body { transition: opacity 0.45s ease; }
    body.page-leaving { opacity: 0; }

    .animate-enter {
      animation: fadeSlideUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-enter-delay-1 {
      opacity: 0;
      animation: fadeSlideUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
    }

    .animate-enter-delay-2 {
      opacity: 0;
      animation: fadeSlideUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }

    /* Primary Teal Pill Button Styling */
    .cta-button {
      background-color: #1D8A93;
      transition: background-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }

    .cta-button:hover {
      background-color: #17747C;
      transform: translateY(-1px);
      box-shadow: 0 10px 24px -6px rgba(29, 138, 147, 0.35);
    }

    .cta-button:active {
      transform: translateY(0px) scale(0.99);
    }
  </style>
</head>
<body data-page="welcome" class="w-screen h-screen bg-[#F4F5F0] flex flex-col items-center justify-center px-6 py-6 sm:py-10 select-none">

  <!-- Main Centered Content Container -->
  <main class="w-full max-w-[380px] sm:max-w-[420px] flex flex-col items-center justify-center text-center">

    <!-- ========================================================= -->
    <!-- CENTERPIECE GEOMETRIC COLLAGE & STUDENT ILLUSTRATION SVG  -->
    <!-- ========================================================= -->
    <div class="w-[260px] sm:w-[300px] md:w-[320px] aspect-[320/355] mb-6 sm:mb-8 animate-enter">
      <svg viewBox="0 0 320 355" class="w-full h-full overflow-visible" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Student holding IELTS books in front of geometric shapes">
        <defs>
          <!-- Clip path for right-side student & geometric collage block -->
          <clipPath id="rightCollageClip">
            <rect x="160" y="16" width="144" height="320" />
          </clipPath>
          <!-- Clip path for bottom-left coral semicircle -->
          <clipPath id="bottomLeftClip">
            <rect x="16" y="176" width="144" height="160" />
          </clipPath>
        </defs>

        <!-- 1. TOP-LEFT: Large Dark Navy Circle sitting atop downward semicircle -->
        <circle cx="88" cy="96" r="72" fill="#182542" />

        <!-- 2. MID-LEFT: Dark Navy Downward Semicircle -->
        <path d="M 16 176 A 144 144 0 0 0 160 320 L 160 176 Z" fill="#182542" />

        <!-- 3. BOTTOM-LEFT: Warm Coral-Orange Upward Semicircle -->
        <g clip-path="url(#bottomLeftClip)">
          <circle cx="88" cy="336" r="72" fill="#EE7651" />
        </g>

        <!-- 4. TOP-RIGHT: Large Warm Coral-Orange Quarter-Circle Arch -->
        <path d="M 160 176 L 160 16 A 144 160 0 0 1 304 176 Z" fill="#EE7651" />

        <!-- 5. BOTTOM-RIGHT: Vibrant Emerald-Green, Teal & Navy Geometric Block -->
        <g clip-path="url(#rightCollageClip)">
          <!-- Emerald Green Base -->
          <rect x="160" y="176" width="144" height="160" fill="#2BB673" />
          <!-- Curved Teal Accent Shape on Right -->
          <path d="M 192 176 C 192 222, 224 256, 272 256 C 284 256, 295 253, 304 248 L 304 176 Z" fill="#1F8E97" />
          <!-- Dark Navy Bottom-Right Corner Block -->
          <rect x="262" y="264" width="42" height="72" fill="#182542" />
        </g>

        <!-- ======================================================= -->
        <!-- FOREGROUND CHARACTER: SMILING STUDENT HOLDING 3 BOOKS   -->
        <!-- ======================================================= -->
        <g id="studentCharacter">
          <!-- Neck & Collar Shadow -->
          <path d="M 193 177 L 193 200 C 193 206, 217 206, 217 200 L 217 177 Z" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linejoin="round" />
          <!-- Subtle Chin Shadow on Neck -->
          <path d="M 194 182 C 201 187, 209 187, 216 182 L 216 188 C 209 192, 201 192, 194 188 Z" fill="#E2A484" />

          <!-- Left White Short Sleeve -->
          <path d="M 166 210 C 151 215, 141 232, 134 255 L 164 263 L 173 224 Z" fill="#FFFFFF" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- Right White Short Sleeve -->
          <path d="M 244 210 C 259 215, 269 232, 276 255 L 246 263 L 237 224 Z" fill="#FFFFFF" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- Green Vest / Torso -->
          <path d="M 166 210 L 187 201 C 197 209, 213 209, 223 201 L 244 210 L 252 336 L 158 336 Z" fill="#2BB673" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- White Crew-Neck Undershirt Collar -->
          <path d="M 186 201 C 195 214, 215 214, 224 201 C 219 198, 216 197, 215 197 C 209 204, 201 204, 195 197 C 194 197, 191 198, 186 201 Z" fill="#FFFFFF" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- White Accent Patch on Upper-Right Chest (Matching Original Artwork) -->
          <path d="M 233 211 L 244 212 L 246 232 C 239 234, 234 230, 233 223 Z" fill="#FFFFFF" />

          <!-- Left Arm Reaching Inward to Hold Books -->
          <path d="M 138 256 L 128 292 C 125 304, 132 314, 144 314 L 184 307 L 181 290 L 154 293 L 161 262 Z" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- ===================================================== -->
          <!-- STACK OF THREE BOOKS HELD AT CHEST                    -->
          <!-- ===================================================== -->
          <!-- Book 1 (Back - White/Cream Book) -->
          <rect x="180" y="226" width="54" height="66" rx="2" fill="#FFFFFF" stroke="#182542" stroke-width="2" />
          <!-- Book 2 (Middle - Warm Coral-Orange Book) -->
          <rect x="177" y="232" width="56" height="66" rx="2" fill="#EE7651" stroke="#182542" stroke-width="2" />
          <!-- White Page Edge Strip -->
          <rect x="179" y="237" width="52" height="4" fill="#FFFFFF" />
          <!-- Book 3 (Front - Dark Navy Hardcover Book) -->
          <rect x="175" y="241" width="58" height="68" rx="2" fill="#182542" stroke="#182542" stroke-width="2" />
          <!-- Subtle Spine Line on Front Book -->
          <line x1="181" y1="242" x2="181" y2="308" stroke="#2D3E63" stroke-width="1.5" />

          <!-- Left Hand Fingers Wrapping Over Book Spine -->
          <g fill="#F4C2A6" stroke="#182542" stroke-width="1.8" stroke-linejoin="round">
            <rect x="172" y="264" width="11" height="5.5" rx="2.7" />
            <rect x="171" y="270" width="12" height="5.5" rx="2.7" />
            <rect x="172" y="276" width="11" height="5.5" rx="2.7" />
            <rect x="173" y="282" width="10" height="5.5" rx="2.7" />
          </g>

          <!-- Right Arm Reaching Around Front of Books -->
          <path d="M 272 256 L 281 294 C 284 307, 275 316, 261 314 L 222 296 L 228 281 L 254 291 L 248 262 Z" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- Right Hand & Fingers Resting on Front Navy Book -->
          <g fill="#F4C2A6" stroke="#182542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <!-- Thumb -->
            <path d="M 227 278 C 221 273, 214 274, 213 278 C 212 281, 218 283, 224 285" />
            <!-- Index Finger -->
            <path d="M 225 283 L 212 280 C 209 279, 207 283, 211 285 L 223 288" />
            <!-- Middle Finger -->
            <path d="M 224 288 L 210 285 C 207 284, 206 288, 210 290 L 222 293" />
            <!-- Ring Finger -->
            <path d="M 223 293 L 212 290 C 209 289, 208 293, 212 295 L 222 298" />
            <!-- Pinky Finger -->
            <path d="M 222 298 L 215 296 C 212 295, 211 299, 215 300 L 223 302" />
          </g>

          <!-- ===================================================== -->
          <!-- HEAD, HAIR & FRIENDLY FACIAL EXPRESSION               -->
          <!-- ===================================================== -->
          <!-- Left & Right Ears -->
          <path d="M 180 147 C 173 146, 172 159, 181 161" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linecap="round" />
          <path d="M 230 147 C 237 146, 238 159, 229 161" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linecap="round" />

          <!-- Face Contour -->
          <path d="M 180 134 C 180 120, 230 120, 230 134 L 229 156 C 228 173, 217 183, 205 183 C 193 183, 182 173, 181 156 Z" fill="#F4C2A6" stroke="#182542" stroke-width="2" stroke-linejoin="round" />

          <!-- Dark Brown Styled Hair -->
          <path d="
            M 180 147
            C 176 135, 177 119, 188 113
            C 196 108, 210 107, 221 112
            C 231 116, 236 125, 233 135
            C 232 140, 231 144, 230 147
            C 229 138, 226 132, 220 130
            C 214 134, 205 135, 198 131
            C 194 135, 189 136, 185 134
            C 182 138, 181 142, 180 147 Z"
            fill="#3B2B23" stroke="#182542" stroke-width="2" stroke-linejoin="round"
          />

          <!-- Eyebrows -->
          <path d="M 189 140 C 192 138, 196 138, 199 140" stroke="#182542" stroke-width="2" stroke-linecap="round" />
          <path d="M 211 140 C 214 138, 218 138, 221 140" stroke="#182542" stroke-width="2" stroke-linecap="round" />

          <!-- Eyes -->
          <circle cx="194.5" cy="147" r="2.2" fill="#182542" />
          <circle cx="215.5" cy="147" r="2.2" fill="#182542" />

          <!-- Nose -->
          <path d="M 205 147 L 203.5 156 L 207 156.5" stroke="#182542" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Open Cheerful Smile -->
          <path d="M 196 163 C 200 164, 210 164, 214 163 C 213 170, 209 173, 205 173 C 201 173, 197 170, 196 163 Z" fill="#FFFFFF" stroke="#182542" stroke-width="1.8" stroke-linejoin="round" />
        </g>
      </svg>
    </div>

    <!-- ========================================================= -->
    <!-- HEADING & FOUR-SKILLS SUBTITLE                            -->
    <!-- ========================================================= -->
    <div class="animate-enter-delay-1">
      <h1 class="display-title text-[36px] sm:text-[42px] font-extrabold text-[#182542]">
        IELTS<br />Preparation
      </h1>

      <p class="mt-3.5 sm:mt-4 text-[14px] sm:text-[15px] font-medium text-[#2C3545] tracking-[-0.01em]">
        Listening &bull; Reading &bull; Writing &bull; Speaking
      </p>
    </div>

    <!-- ========================================================= -->
    <!-- PILL CALL-TO-ACTION BUTTON & PAGINATION DOTS              -->
    <!-- ========================================================= -->
    <div class="w-full flex flex-col items-center mt-7 sm:mt-8 animate-enter-delay-2">
      <button
        id="getStartedBtn"
        type="button"
        class="cta-button w-full max-w-[300px] sm:max-w-[330px] h-[52px] sm:h-[56px] rounded-full text-white font-semibold text-[16px] sm:text-[17px] tracking-[-0.01em] cursor-pointer focus:outline-none focus:ring-4 focus:ring-[#1D8A93]/30"
      >
        Get Started
      </button>

      <!-- Three Pagination Indicator Dots -->
      <div class="flex items-center justify-center gap-2.5 mt-6 sm:mt-7" aria-label="Onboarding step 1 of 3">
        <span class="w-2.5 h-2.5 rounded-full bg-[#1D8A93]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#D5D8D6]"></span>
        <span class="w-2.5 h-2.5 rounded-full bg-[#D5D8D6]"></span>
      </div>
    </div>

  </main>

  <script>
    // Interactive feedback when clicking "Get Started"
    document.getElementById('getStartedBtn').addEventListener('click', function () {
      this.style.transform = 'scale(0.97)';
      setTimeout(() => {
        this.style.transform = '';
      }, 140);
    });
  </script>
  <script src="link.js"></script>
</body>
</html>
