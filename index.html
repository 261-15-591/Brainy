<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brainy: AI IELTS Prep</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Google Font: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Full-Viewport Pure Intro Styling */
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #D6ECFF 0%, #DFEFFD 50%, #E6F4FF 100%);
      color: #0B1D3A;
    }

    .brand-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.03em;
    }

    /* Subtle Ambient Floating Animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(2deg); }
    }

    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(8px) rotate(-2deg); }
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 6px rgba(249, 168, 37, 0.45)); }
      50% { transform: scale(1.12) rotate(6deg); filter: drop-shadow(0 0 14px rgba(249, 168, 37, 0.8)); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.92; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }

    @keyframes gentleBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes loadingSweep {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(65%); }
      100% { transform: translateX(220%); }
    }

    .animate-float-1 { animation: floatSlow 5.2s ease-in-out infinite; }
    .animate-float-2 { animation: floatReverse 6.0s ease-in-out infinite; }
    .animate-float-3 { animation: floatSlow 5.8s ease-in-out 0.8s infinite; }
    .animate-float-4 { animation: floatReverse 5.4s ease-in-out 1.2s infinite; }
    .animate-star-pulse {
      transform-origin: 215px 58px;
      animation: pulseStar 3.2s ease-in-out infinite;
    }
    .animate-twinkle { animation: twinkle 2.8s ease-in-out infinite; }
    .animate-breathe { animation: gentleBreathe 4.5s ease-in-out infinite; }
    .animate-loading-bar { animation: loadingSweep 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden flex items-center justify-center select-none">

  <!-- ========================================================= -->

</html>
